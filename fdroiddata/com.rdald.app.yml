# Template for the F-Droid data repo (gitlab.com/fdroid/fdroiddata).
# Copy this file to `metadata/com.rdald.app.yml` in a fork of fdroiddata, edit the
# placeholders (USER/REPO, License, Author), then open a merge request.
#
# Notes:
# - The repo root IS the Gradle project (no subdirectory), so no `subdir` is needed.
# - F-Droid builds the *unsigned* `release` variant (`gradle: - yes` -> assembleRelease)
#   and signs the result with its own key. Do not commit signing keys.
# - Bump versionName/versionCode in app/build.gradle.kts and F-Droid's AutoUpdate
#   will pick new tagged releases.

